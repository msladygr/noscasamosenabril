<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeri & Fati | Nuestra Boda</title>
    <!-- Google Fonts unificadas -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-color: #2C2C2C;
            --accent-green: #3D4F41;
            --accent-wood: #7A5C43;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
            font-family: 'Montserrat', sans-serif;
        }

        html, body {
            min-height: 100vh;
            color: var(--dark-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* FONDO ANIMADO INMERSIVO EN MOVIMIENTO FLUIDO */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -999;
            background: linear-gradient(-45deg, #F4F1EA, #E6E0D5, #D8E2DC, #EBE3D5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1, h2, h3 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
        }

        /* Pantalla de bienvenida inicial (Splash Screen UX) */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--white);
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #welcome-screen::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('20250823_182139.jpg') no-repeat center center/cover;
            filter: blur(8px);
            z-index: -1;
        }

        #welcome-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #welcome-screen h1 {
            font-size: 4.5rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        #welcome-screen p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        /* Reproductor de música flotante */
        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.8);
            transition: all 0.3s ease;
        }
        .music-player:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .music-player i {
            color: var(--accent-green);
            font-size: 1.2rem;
        }
        .music-player span {
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Portada / Hero principal con blur artístico */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('20250823_182139.jpg') no-repeat center center/cover;
            filter: blur(6px);
            transform: scale(1.02);
            color: var(--white);
            padding: 20px;
            position: relative;
        }

        .hero-content {
            position: absolute;
            z-index: 2;
            text-align: center;
            color: var(--white);
            width: 100%;
            padding: 0 20px;
        }

        .hero-content h1 {
            font-size: 4.8rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
            animation: fadeInDown 1.5s ease;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .hero-content p {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            animation: fadeInUp 1.5s ease;
        }

        /* Cuenta regresiva */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            animation: fadeInUp 2s ease;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            min-width: 75px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .time-box span {
            display: block;
            font-size: 1.8rem;
            font-weight: 600;
            font-family: 'Cormorant Garamond', serif;
        }

        .time-box label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Secciones con tarjetas translúcidas flotantes */
        section {
            padding: 60px 20px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        section h2 {
            font-size: 2.8rem;
            color: var(--accent-green);
